name: Python Test
on:
  push:
    branches:
      -main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Run tests
      run: |
        python -m unittest src/test/challenge_1_test.py
        python -m unittest src/test/challenge_2_test.py
        python -m unittest src/test/challenge_3_test.py
